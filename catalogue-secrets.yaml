apiVersion: v1
kind: Pod

metadata:
  name: catalogue
  namespace: roboshop

spec:
  containers:
    - name: catalogue
      image: niteeshgandham/catalogue:1.0.0

      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: catalogue-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: catalogue-secret
              key: DB_PASSWORD